[project]
name = "anonxmusic"
version = "3.0.3"
description = "Telegram Group Calls Streaming bot with some useful features."
readme = ".github/README.md"
requires-python = ">=3.10"

dependencies = [
    "aiohttp~=3.14.5",
    "kurigram>=2.2.26",
    "ntgcalls~=3.0.5",
    "pillow~=12.3.0",
    "psutil~=7.2.2",
    "py-tgcalls~=3.0.0",
    "py-yt-search~=0.8.0",
    "pymongo>=4.18.3",
    "pytgcrypto>=1.2.12",
    "python-dotenv~=1.2.4",
    "yt-dlp[default]>=2026.10.21",
]
